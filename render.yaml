# Render Blueprint for Cortex AI Back-Office
# Deploy: https://dashboard.render.com/blueprints
#
# This blueprint deploys:
# 1. cortex-api  - Express API + SSE + Baileys WhatsApp + Background Schedulers
# 2. cortex-web  - React + Vite static frontend (Command Center)
# 3. cortex-db   - PostgreSQL (optional, PGlite on disk is default)

services:
  # Main API Server - Express + SSE + Baileys WhatsApp + Schedulers
  - type: web
    name: cortex-api
    runtime: node
    plan: free
    region: singapore  # Closest to India for low latency
    buildCommand: |
      cd cortex
      corepack enable pnpm
      pnpm install --frozen-lockfile
      pnpm -r run build
    startCommand: |
      cd cortex
      pnpm --filter @cortex/server start
    healthCheckPath: /api/cortex/workforce
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3200"
      # Sarvam AI (Indic LLM + Voice) — required for Hindi/Hinglish TTS/STT
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_LLM_MODEL
        value: sarvam-105b-conversations
      - key: SARVAM_DEFAULT_LANGUAGE
        value: hi-IN
      - key: SARVAM_DEFAULT_SPEAKER
        value: meera
      # WhatsApp Cloud API (Meta Business) — optional; Baileys is primary for demo
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: cortex-verify
      # Telegram Bot — optional; simulator used if not set
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Demo recipients for decision cards (owner's WhatsApp/Telegram ID)
      - key: DEMO_WHATSAPP_RECIPIENT
        sync: false
      - key: DEMO_TELEGRAM_RECIPIENT
        sync: false
      # LLM Provider selection
      - key: LLM_PROVIDER
        value: sarvam
      # Baileys auth directory (persisted on disk)
      - key: WHATSAPP_AUTH_DIR
        value: /app/cortex/data/.baileys-auth
      # Store ID for single-store demo mode
      - key: DEMO_STORE_ID
        value: store-ramesh
    # Persistent disk for PGlite database + WhatsApp Baileys session
    disk:
      name: cortex-data
      mountPath: /app/cortex/data
      sizeGB: 1

  # Frontend - React + Vite static build
  - type: web
    name: cortex-web
    runtime: static
    plan: free
    buildCommand: |
      cd cortex/apps/web
      corepack enable pnpm
      pnpm install --frozen-lockfile
      pnpm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://cortex-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

# Optional: Managed PostgreSQL (alternative to PGlite on disk)
# Uncomment the below to use managed Postgres instead of PGlite on disk
# databases:
#   - name: cortex-db
#     databaseName: cortex
#     user: cortex
#     plan: free
#     region: singapore
#     # If using managed PG, also add this env var to cortex-api service:
#     # - key: DATABASE_URL
#     #   fromDatabase:
#     #     name: cortex-db
#     #     property: connectionString

# Deploy notes:
# 1. Set SARVAM_API_KEY in Render dashboard for voice/TTS to work
# 2. Set WHATSAPP_ACCESS_TOKEN + WHATSAPP_PHONE_NUMBER_ID for Meta Cloud API (optional)
# 3. Set TELEGRAM_BOT_TOKEN for Telegram bot (optional)
# 4. Set DEMO_WHATSAPP_RECIPIENT to your WhatsApp number (with country code, e.g., 919876543210)
#    to receive decision cards in the live WhatsApp self-chat
# 5. The demo auto-seeds on first boot via seedDemoStore()
# 6. PGlite database persists on the 'cortex-data' disk across deploys
# 7. Baileys WhatsApp auth also persists on the same disk (survives restarts)
# 8. Health check at /api/cortex/workforce ensures the API is ready
# 9. To use managed PostgreSQL instead of PGlite: uncomment the 'databases:' section above
#    and add DATABASE_URL env var to cortex-api service (see commented example)