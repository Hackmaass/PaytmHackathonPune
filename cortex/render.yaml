# Render Blueprint for Cortex AI Back-Office
# Deploy: https://dashboard.render.com/blueprints

services:
  # Main API Server - Express + SSE + Baileys WhatsApp + Schedulers
  - type: web
    name: cortex-api
    runtime: node
    plan: free
    region: singapore  # Closest to India for low latency
    buildCommand: |
      cd cortex
      corepack enable pnpm
      pnpm install --frozen-lockfile
      pnpm -r run build
    startCommand: |
      cd cortex
      pnpm --filter @cortex/server start
    healthCheckPath: /api/cortex/workforce
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3200"
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_LLM_MODEL
        value: sarvam-105b-conversations
      - key: SARVAM_DEFAULT_LANGUAGE
        value: hi-IN
      - key: SARVAM_DEFAULT_SPEAKER
        value: meera
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: cortex-verify
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: sarvam
    # Persistent disk for PGlite database + WhatsApp session
    disk:
      name: cortex-data
      mountPath: /app/cortex/data
      sizeGB: 1

  # Frontend - React + Vite static build
  - type: web
    name: cortex-web
    runtime: static
    plan: free
    buildCommand: |
      cd cortex/apps/web
      corepack enable pnpm
      pnpm install --frozen-lockfile
      pnpm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://cortex-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

# Optional: PostgreSQL database (if you prefer over PGlite)
